<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA — Tutor Saber Pro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: rgba(255,255,255,0.08);
    --accent: #4f8ef7;
    --accent2: #7c5af7;
    --success: #34c98a;
    --warn: #f5a623;
    --danger: #f75a5a;
    --text: #e8eaf0;
    --text2: #8b90a7;
    --text3: #555a72;
    --radius: 12px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── LOGIN ── */
  #login-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem;
    width: 100%;
    max-width: 420px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.8rem;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .logo-text { line-height: 1.2; }
  .logo-text h1 { font-size: 20px; font-weight: 600; }
  .logo-text p { font-size: 12px; color: var(--text2); }

  .login-title { font-size: 15px; font-weight: 500; margin-bottom: 1.4rem; color: var(--text2); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }

  .field input, .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }

  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--surface2); }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    color: #fff;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity .2s, transform .1s;
  }

  .btn-primary:hover { opacity: .9; }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

  /* ── APP ── */
  #app-screen { display: none; flex: 1; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; padding: 1rem; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  .user-info p { font-size: 13px; font-weight: 500; }
  .user-info span { font-size: 11px; color: var(--text2); }

  .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px; font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
  .stat-pill strong { color: var(--text); font-weight: 500; }

  /* chat */
  #chat-area {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    height: calc(100vh - 200px);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

  .msg { display: flex; gap: 10px; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.aria { align-self: flex-start; }

  .msg-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px; }
  .msg.aria .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .msg.user .msg-avatar { background: var(--surface2); border: 1px solid var(--border); font-size: 11px; font-weight: 600; }

  .msg-bubble {
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.aria .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .msg-bubble { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-top-right-radius: 4px; }

  .msg-bubble.typing { color: var(--text2); font-style: italic; }

  /* opciones A B C D */
  .options-grid { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
  .opt-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    font-family: var(--font);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: all .15s;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .opt-btn:hover { border-color: var(--accent); background: rgba(79,142,247,.08); }
  .opt-btn .opt-letter { font-weight: 600; color: var(--accent); min-width: 18px; }
  .opt-btn.correct { border-color: var(--success); background: rgba(52,201,138,.1); }
  .opt-btn.wrong { border-color: var(--danger); background: rgba(247,90,90,.1); }
  .opt-btn:disabled { cursor: not-allowed; opacity: .7; }

  /* input */
  .input-area {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #user-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    resize: none;
    min-height: 42px;
    max-height: 120px;
    transition: border-color .2s;
    line-height: 1.5;
  }

  #user-input:focus { border-color: var(--accent); }
  #user-input::placeholder { color: var(--text3); }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity .2s;
    font-size: 18px;
  }
  .send-btn:hover { opacity: .85; }
  .send-btn:disabled { opacity: .35; cursor: not-allowed; }

  .module-selector {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .mod-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 5px 12px;
    font-size: 12px;
    font-family: var(--font);
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
  }
  .mod-chip:hover { border-color: var(--accent); color: var(--accent); }

  #session-end {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    text-align: center;
    margin-top: 12px;
  }
  #session-end h3 { font-size: 18px; margin-bottom: 8px; }
  #session-end p { font-size: 13px; color: var(--text2); margin-bottom: 1rem; }
  .score-big { font-size: 48px; font-weight: 600; background: linear-gradient(135deg, var(--accent), var(--success)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">
        <h1>ARIA</h1>
        <p>Tutor Saber Pro · Administración</p>
      </div>
    </div>
    <p class="login-title">Ingresa tus datos para comenzar</p>

    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="inp-nombre" placeholder="Ej: María Pérez" autocomplete="name">
    </div>
    <div class="field">
      <label>Código estudiantil</label>
      <input type="text" id="inp-codigo" placeholder="Ej: 202015234">
    </div>
    <div class="field">
      <label>Módulo a practicar hoy</label>
      <select id="inp-modulo">
        <option value="">— Selecciona un módulo —</option>
        <option value="Formulación, Evaluación y Gestión de Proyectos">Formulación, Evaluación y Gestión de Proyectos</option>
        <option value="Gestión de Organizaciones">Gestión de Organizaciones</option>
        <option value="Lectura Crítica">Lectura Crítica</option>
        <option value="Razonamiento Cuantitativo">Razonamiento Cuantitativo</option>
        <option value="Inglés">Inglés</option>
        <option value="Competencias Ciudadanas">Competencias Ciudadanas</option>
        <option value="Comunicación Escrita">Comunicación Escrita</option>
      </select>
    </div>
    <p class="error-msg" id="login-error">Por favor completa todos los campos.</p>
    <button class="btn-primary" onclick="startSession()">Comenzar práctica →</button>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-info">
        <p id="user-name-display">Estudiante</p>
        <span id="modulo-display">Módulo</span>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-pill">Preguntas: <strong id="stat-total">0</strong></div>
      <div class="stat-pill">✓ <strong id="stat-correctas" style="color:var(--success)">0</strong></div>
      <div class="stat-pill">✗ <strong id="stat-incorrectas" style="color:var(--danger)">0</strong></div>
    </div>
  </div>

  <div id="chat-area">
    <div id="messages"></div>
    <div class="input-area">
      <textarea id="user-input" placeholder="Escribe tu respuesta o mensaje..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Enviar">➤</button>
    </div>
  </div>
</div>

<script>
// ── Estado global ──
const STATE = {
  nombre: '', codigo: '', modulo: '',
  historial: [],
  totalPreguntas: 0,
  correctas: 0,
  incorrectas: 0,
  esperandoRespuesta: false,
  sessionId: Date.now()
};

// ── SYSTEM PROMPT de ARIA ──
function buildSystemPrompt(nombre, modulo) {
  return `Eres ARIA, tutora especializada en preparar estudiantes de Administración de Empresas para el examen Saber Pro del ICFES en Colombia.

El estudiante se llama ${nombre} y quiere practicar el módulo: ${modulo}.

INSTRUCCIONES OBLIGATORIAS:
1. Saluda a ${nombre} por su nombre, menciona el módulo elegido y presenta inmediatamente la primera pregunta de práctica.
2. Cada pregunta debe tener formato EXACTO: enunciado claro + 4 opciones etiquetadas A), B), C), D). Usa casos colombianos o latinoamericanos reales.
3. Presenta SOLO UNA pregunta a la vez. Espera la respuesta antes de continuar.
4. Después de cada respuesta da retroalimentación profunda:
   - Si CORRECTA: confirma con entusiasmo, explica el concepto, da un tip extra.
   - Si INCORRECTA: sin lenguaje negativo, explica el error conceptual, muestra por qué cada opción incorrecta lo es, conecta con algo conocido.
5. Adapta dificultad: 3 correctas seguidas = sube nivel; 2 incorrectas seguidas = baja nivel.
6. Al detectar que el estudiante quiere terminar (dice "terminar", "fin", "ya acabé") presenta un resumen final con: total de preguntas, % de acierto, competencias más débiles y plan de acción.

CALIDAD DE PREGUNTAS según módulo:
- Formulación de Proyectos: VPN, TIR, Marco Lógico, indicadores, evaluación ex-ante.
- Gestión de Organizaciones: planeación, organización, dirección, control, casos empresariales.
- Lectura Crítica: textos de máx 250 palabras, preguntas de inferencia y análisis.
- Razonamiento Cuantitativo: tablas, gráficos, interpretación numérica.
- Inglés: textos nivel B1-B2, preguntas en inglés, retroalimentación bilingüe.
- Competencias Ciudadanas: dilemas éticos, participación, derechos.
- Comunicación Escrita: coherencia, cohesión, estructura textual.

TONO: cercano, motivador, profesional. Eres paciente y celebras el esfuerzo.
IMPORTANTE: Las opciones de respuesta NO deben incluir letras al inicio (sin A., B., C., D.) en el texto de cada opción, solo en la etiqueta. Ejemplo correcto: "A) El VPN positivo indica viabilidad".`;
}

// ── Login ──
function startSession() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const codigo = document.getElementById('inp-codigo').value.trim();
  const modulo = document.getElementById('inp-modulo').value;
  const err = document.getElementById('login-error');

  if (!nombre || !codigo || !modulo) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';

  STATE.nombre = nombre;
  STATE.codigo = codigo;
  STATE.modulo = modulo;

  document.getElementById('user-avatar').textContent = nombre.charAt(0).toUpperCase();
  document.getElementById('user-name-display').textContent = nombre;
  document.getElementById('modulo-display').textContent = modulo;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';

  iniciarChat();
}

// ── Chat ──
function iniciarChat() {
  const systemPrompt = buildSystemPrompt(STATE.nombre, STATE.modulo);
  STATE.historial = [{ role: 'user', parts: [{ text: systemPrompt }] }];
  callGemini('Hola, estoy listo para practicar.');
}

function addMessage(role, text, opciones) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'msg-avatar';
  avatarDiv.textContent = role === 'aria' ? '🎓' : STATE.nombre.charAt(0).toUpperCase();

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  if (opciones && opciones.length > 0) {
    const grid = document.createElement('div');
    grid.className = 'options-grid';
    opciones.forEach((op, i) => {
      const letters = ['A', 'B', 'C', 'D'];
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-letter">${letters[i]})</span><span>${op}</span>`;
      btn.onclick = () => selectOption(btn, letters[i], op, grid);
      grid.appendChild(btn);
    });
    bubble.appendChild(grid);
  }

  div.appendChild(avatarDiv);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function selectOption(btn, letra, texto, grid) {
  Array.from(grid.querySelectorAll('.opt-btn')).forEach(b => b.disabled = true);
  const userMsg = `${letra}) ${texto}`;
  addMessage('user', userMsg);
  STATE.totalPreguntas++;
  sendToAria(userMsg);
}

function addTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg aria';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar">🎓</div>
    <div class="msg-bubble typing">ARIA está pensando...</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ── Gemini API ──
async function callGemini(userText) {
  document.getElementById('send-btn').disabled = true;
  document.getElementById('user-input').disabled = true;
  STATE.esperandoRespuesta = true;
  addTyping();

  STATE.historial.push({ role: 'user', parts: [{ text: userText }] });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        historial: STATE.historial,
        nombre: STATE.nombre,
        codigo: STATE.codigo,
        modulo: STATE.modulo,
        stats: {
          total: STATE.totalPreguntas,
          correctas: STATE.correctas,
          incorrectas: STATE.incorrectas
        }
      })
    });

    const data = await res.json();
    removeTyping();

    if (data.error) throw new Error(data.error);

    const respuesta = data.text;
    STATE.historial.push({ role: 'model', parts: [{ text: respuesta }] });

    // Detectar si hay opciones A) B) C) D) en la respuesta
    const opciones = extraerOpciones(respuesta);
    const textoLimpio = opciones.length > 0 ? quitarOpciones(respuesta) : respuesta;

    // Detectar acierto/error en retroalimentación
    if (userText.match(/^[ABCD]\)/)) {
      if (respuesta.toLowerCase().includes('correcto') ||
          respuesta.toLowerCase().includes('excelente') ||
          respuesta.toLowerCase().includes('muy bien') ||
          respuesta.toLowerCase().includes('¡bien')) {
        STATE.correctas++;
      } else {
        STATE.incorrectas++;
      }
      updateStats();
    }

    addMessage('aria', textoLimpio, opciones);

    // Guardar progreso si hay pregunta respondida
    if (userText.match(/^[ABCD]\)/)) guardarProgreso(userText, respuesta);

  } catch (err) {
    removeTyping();
    addMessage('aria', '⚠️ Hubo un error al conectar con el servidor. Por favor recarga la página e intenta de nuevo.');
    console.error(err);
  }

  document.getElementById('send-btn').disabled = false;
  document.getElementById('user-input').disabled = false;
  document.getElementById('user-input').focus();
  STATE.esperandoRespuesta = false;
}

function extraerOpciones(texto) {
  const lineas = texto.split('\n');
  const opts = [];
  lineas.forEach(l => {
    const m = l.match(/^[A-D]\)\s+(.+)/);
    if (m) opts.push(m[1].trim());
  });
  return opts.length === 4 ? opts : [];
}

function quitarOpciones(texto) {
  return texto.split('\n').filter(l => !l.match(/^[A-D]\)\s+/)).join('\n').trim();
}

function updateStats() {
  document.getElementById('stat-total').textContent = STATE.totalPreguntas;
  document.getElementById('stat-correctas').textContent = STATE.correctas;
  document.getElementById('stat-incorrectas').textContent = STATE.incorrectas;
}

async function guardarProgreso(preguntaResp, retroalimentacion) {
  try {
    await fetch('/api/guardar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: STATE.nombre,
        codigo: STATE.codigo,
        modulo: STATE.modulo,
        respuesta: preguntaResp,
        correctas: STATE.correctas,
        incorrectas: STATE.incorrectas,
        total: STATE.totalPreguntas,
        fecha: new Date().toLocaleString('es-CO', { timeZone: 'America/Bogota' })
      })
    });
  } catch (e) {
    console.warn('No se pudo guardar el progreso:', e);
  }
}

// ── Enviar texto libre ──
function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || STATE.esperandoRespuesta) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  sendToAria(text);
}

function sendToAria(text) {
  callGemini(text);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
</script>
</body>
</html>
